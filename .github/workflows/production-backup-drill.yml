name: Production backup drill

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Írd be: PRODUCTION-BACKUP"
        required: true
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: production-backup-drill
  cancel-in-progress: false

jobs:
  production-backup-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
      PRODUCTION_DRILL_AGE_RECIPIENT: ${{ vars.PRODUCTION_DRILL_AGE_RECIPIENT }}
      BACKUP_GDRIVE_REMOTE: ${{ vars.BACKUP_GDRIVE_REMOTE }}
      BACKUP_B2_REMOTE: ${{ vars.BACKUP_B2_REMOTE }}

      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.BACKUP_GDRIVE_CLIENT_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_GDRIVE_CLIENT_SECRET }}
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.BACKUP_GDRIVE_RCLONE_TOKEN }}

      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.BACKUP_B2_DAILY_ACCOUNT_ID }}
      RCLONE_CONFIG_B2_KEY: ${{ secrets.BACKUP_B2_DAILY_APPLICATION_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require explicit production confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: bash ./scripts/lib/validate-production-backup-trigger.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF_NAME" "$CONFIRMATION"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Install backup dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age rclone jq postgresql-client

      - name: Validate required production drill configuration
        run: |
          required=(
            PRODUCTION_DB_URL
            PRODUCTION_DRILL_AGE_RECIPIENT
            BACKUP_GDRIVE_REMOTE
            BACKUP_B2_REMOTE
            RCLONE_CONFIG_GDRIVE_CLIENT_ID
            RCLONE_CONFIG_GDRIVE_CLIENT_SECRET
            RCLONE_CONFIG_GDRIVE_TOKEN
            RCLONE_CONFIG_B2_ACCOUNT
            RCLONE_CONFIG_B2_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing production drill configuration: $name" >&2
              exit 1
            fi
          done

      - name: Run encrypted dual-target production backup drill
        run: bash ./scripts/backup-production-drill.sh
