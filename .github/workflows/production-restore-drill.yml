name: Production isolated restore drill

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Írd be: RESTORE-PRODUCTION"
        required: true
        default: ""
        type: string
      artifact:
        description: "A production drill .tar.gz.age artifact pontos neve"
        required: true
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: production-isolated-restore-drill
  cancel-in-progress: false

jobs:
  production-isolated-restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      PRODUCTION_DRILL_AGE_IDENTITY: ${{ secrets.PRODUCTION_DRILL_AGE_IDENTITY }}
      BACKUP_GDRIVE_REMOTE: ${{ vars.BACKUP_GDRIVE_REMOTE }}
      BACKUP_B2_REMOTE: ${{ vars.BACKUP_B2_REMOTE }}

      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.BACKUP_GDRIVE_CLIENT_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_GDRIVE_CLIENT_SECRET }}
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.BACKUP_GDRIVE_RCLONE_TOKEN }}

      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.BACKUP_B2_DAILY_ACCOUNT_ID }}
      RCLONE_CONFIG_B2_KEY: ${{ secrets.BACKUP_B2_DAILY_APPLICATION_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve and validate production restore request
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_ARTIFACT: ${{ inputs.artifact }}
        run: |
          bash ./scripts/lib/validate-production-restore-trigger.sh             "$GITHUB_EVENT_NAME" "$GITHUB_REF_NAME" "$INPUT_CONFIRMATION" "$INPUT_ARTIFACT"
          printf 'PRODUCTION_DRILL_ARTIFACT=%s\n' "$INPUT_ARTIFACT" >> "$GITHUB_ENV"

      - name: Validate required restore configuration
        run: |
          required=(
            PRODUCTION_DRILL_AGE_IDENTITY
            BACKUP_GDRIVE_REMOTE
            BACKUP_B2_REMOTE
            RCLONE_CONFIG_GDRIVE_CLIENT_ID
            RCLONE_CONFIG_GDRIVE_CLIENT_SECRET
            RCLONE_CONFIG_GDRIVE_TOKEN
            RCLONE_CONFIG_B2_ACCOUNT
            RCLONE_CONFIG_B2_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing production restore configuration: $name" >&2
              exit 1
            fi
          done

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Install restore dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age rclone jq postgresql-client

      - name: Run isolated production restore drill
        run: bash ./scripts/restore-production-drill.sh
