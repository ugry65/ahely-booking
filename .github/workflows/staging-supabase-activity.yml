name: Staging Supabase activity

on:
  schedule:
    - cron: "17 3,9,15,21 * * *"
      timezone: "Europe/Budapest"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/staging-supabase-activity.yml"
      - "scripts/staging-activity.mjs"
      - "scripts/test-staging-activity.mjs"

permissions:
  contents: read

concurrency:
  group: staging-activity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/test-staging-activity.mjs

  staging-activity:
    needs: tests
    if: ${{ github.repository == 'ugry65/ahely-booking' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check staging database and report heartbeat
        env:
          STAGING_ACTIVITY_HEARTBEAT_URL: ${{ secrets.STAGING_ACTIVITY_HEARTBEAT_URL }}
        run: node scripts/staging-activity.mjs
