name: Database tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"
      - "scripts/test-database.sh"
      - "scripts/test-room-access-concurrency.sh"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"
      - "scripts/test-database.sh"
      - "scripts/test-room-access-concurrency.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start local database
        run: supabase db start

      - name: Rebuild database from migrations and seed
        run: supabase db reset

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Run concurrent booking integration test
        run: ./scripts/test-booking-concurrency.sh

      - name: Run concurrent booking mutation tests
        run: ./scripts/test-booking-mutation-concurrency.sh

      - name: Run concurrent room access administration tests
        run: bash ./scripts/test-room-access-concurrency.sh

      - name: Lint database schema
        run: supabase db lint --level warning

      - name: Stop local Supabase services
        if: always()
        run: supabase stop
