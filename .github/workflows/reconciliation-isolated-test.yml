name: Isolated historical AllBooked reconciliation

on:
  pull_request:
    paths:
      - "scripts/staging-reconciliation-forward.sql"
      - "supabase/tests/database/110_generic_allbooked_customer_import.sql"
      - ".github/workflows/reconciliation-isolated-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Generate forward migration with Supabase CLI
        run: |
          supabase migration new retire_historical_allbooked_rpcs
          migration_file="$(find supabase/migrations -maxdepth 1 -name '*_retire_historical_allbooked_rpcs.sql' -print -quit)"
          test -n "$migration_file"
          cp scripts/staging-reconciliation-forward.sql "$migration_file"
          cp "$migration_file" generated-reconciliation-migration.sql
          basename "$migration_file" > generated-reconciliation-filename.txt
      - name: Build fresh isolated reference
        run: |
          supabase db start
          supabase db reset
      - name: Run database tests and schema lint
        run: |
          supabase test db
          supabase db lint --level warning
      - name: Capture final schema inventory
        run: docker exec -i supabase_db_${{ github.event.repository.name }} psql -U postgres -d postgres -XAt -v ON_ERROR_STOP=1 < scripts/schema-inventory.sql > reconciled-reference-schema.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconciliation-isolated-evidence
          path: |
            generated-reconciliation-migration.sql
            generated-reconciliation-filename.txt
            reconciled-reference-schema.jsonl
          if-no-files-found: warn
      - name: Stop local database
        if: always()
        run: supabase stop
