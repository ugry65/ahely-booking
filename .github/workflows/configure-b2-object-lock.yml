name: Configure B2 Object Lock

# Manual-only production infrastructure configuration.
# This workflow is intentionally not triggered by pull_request or schedule.
# Running it requires an explicit typed confirmation.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type GOVERNANCE_30 to verify/apply the approved B2 Object Lock policy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: configure-b2-object-lock
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      BACKUP_B2_ACCOUNT_ID: ${{ secrets.BACKUP_B2_ACCOUNT_ID }}
      BACKUP_B2_APPLICATION_KEY: ${{ secrets.BACKUP_B2_APPLICATION_KEY }}
      BACKUP_B2_REMOTE: ${{ vars.BACKUP_B2_REMOTE }}
      B2_OBJECT_LOCK_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Require explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${B2_OBJECT_LOCK_CONFIRMATION:-}" != "GOVERNANCE_30" ]; then
            echo "B2 Object Lock configuration not approved: type GOVERNANCE_30 exactly." >&2
            exit 1
          fi
          echo "PASS: explicit B2 Object Lock confirmation is present."

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: bash -n ./scripts/configure-b2-object-lock.sh

      - name: Configure and verify Governance 30-day Object Lock
        run: bash ./scripts/configure-b2-object-lock.sh
