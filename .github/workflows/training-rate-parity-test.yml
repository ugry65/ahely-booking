name: Training rate parity regression
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  training-rate-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: training_parity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-training-rate-parity.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: training_parity_test
          PGUSER: postgres
          PGPASSWORD: isolated-test-only
