name: Verify backup heartbeat alert recovery

# Controlled one-shot monitoring drill.
# It never touches the production database or backup targets.
# It only sends an explicit failure signal followed by recovery to the
# existing 08:00 Healthchecks.io check. Execution is gated by the exact
# MONITORING_DRILL_APPROVED=ALERT_RECOVERY repository variable.
# Retrigger marker: gate configured 2026-09-02.
on:
  pull_request:
    branches:
      - feature/82-pricing-modes
    paths:
      - ".github/workflows/verify-backup-heartbeat-alert.yml"

permissions:
  contents: read

concurrency:
  group: verify-backup-heartbeat-alert-recovery
  cancel-in-progress: false

jobs:
  drill:
    if: ${{ github.event.pull_request.head.ref == 'infra/100-backup-monitoring' && vars.MONITORING_DRILL_APPROVED == 'ALERT_RECOVERY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_08_URL }}

    steps:
      - name: Validate heartbeat configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HEARTBEAT_URL:-}" ]; then
            echo "Missing BACKUP_HEARTBEAT_08_URL" >&2
            exit 1
          fi
          case "$HEARTBEAT_URL" in
            https://hc-ping.com/*) ;;
            *)
              echo "Heartbeat URL is not an expected Healthchecks.io ping URL" >&2
              exit 1
              ;;
          esac

      - name: Send controlled failure signal
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 20 "${HEARTBEAT_URL%/}/fail" >/dev/null
          echo "Controlled failure signal accepted by Healthchecks.io"

      - name: Allow alert delivery window
        run: sleep 45

      - name: Send recovery signal
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 20 "${HEARTBEAT_URL%/}" >/dev/null
          echo "Recovery signal accepted by Healthchecks.io"
