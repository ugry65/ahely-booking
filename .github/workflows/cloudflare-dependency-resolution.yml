name: Cloudflare dependency resolution

on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-dependency-resolution.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Explicitly allow required binary install scripts
        run: |
          cat > pnpm-workspace.yaml <<'YAML'
          allowBuilds:
            esbuild: true
            workerd: true
          YAML
      - name: Resolve current official Cloudflare packages
        run: |
          pnpm add --save-exact @opennextjs/cloudflare@latest
          pnpm add --save-dev --save-exact wrangler@latest
          node -e "const p=require('./package.json'); console.log('opennext=',p.dependencies['@opennextjs/cloudflare']); console.log('wrangler=',p.devDependencies.wrangler)"
      - name: Commit resolved dependencies to test branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: lock Cloudflare adapter dependencies"
          git push origin HEAD:${{ github.head_ref }}
