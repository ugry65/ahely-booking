name: Verify production dual-target backup

on:
  pull_request:
    branches:
      - feature/82-pricing-modes
    paths:
      - ".github/workflows/verify-production-dual-target-backup.yml"

permissions:
  contents: read

concurrency:
  group: verify-production-dual-target-backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ github.event.pull_request.head.ref == 'infra/100-backup-monitoring' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      PRODUCTION_BACKUP_TEST_APPROVED: ${{ vars.PRODUCTION_BACKUP_TEST_APPROVED }}
      PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      BACKUP_GDRIVE_REMOTE: ${{ vars.BACKUP_GDRIVE_REMOTE }}
      BACKUP_B2_REMOTE: ${{ vars.BACKUP_B2_REMOTE }}

      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.BACKUP_GDRIVE_CLIENT_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_GDRIVE_CLIENT_SECRET }}
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.BACKUP_GDRIVE_RCLONE_TOKEN }}

      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.BACKUP_B2_ACCOUNT_ID }}
      RCLONE_CONFIG_B2_KEY: ${{ secrets.BACKUP_B2_APPLICATION_KEY }}

    steps:
      - name: Require explicit one-shot approval
        shell: bash
        run: |
          set -euo pipefail
          if [ "${PRODUCTION_BACKUP_TEST_APPROVED:-}" != "BACKUP" ]; then
            echo "Production backup verification is not approved: expected PRODUCTION_BACKUP_TEST_APPROVED=BACKUP" >&2
            exit 1
          fi
          echo "PASS: explicit production backup verification approval is present."

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required production backup configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            PRODUCTION_DB_URL
            BACKUP_AGE_RECIPIENT
            BACKUP_GDRIVE_REMOTE
            BACKUP_B2_REMOTE
            RCLONE_CONFIG_GDRIVE_CLIENT_ID
            RCLONE_CONFIG_GDRIVE_CLIENT_SECRET
            RCLONE_CONFIG_GDRIVE_TOKEN
            RCLONE_CONFIG_B2_ACCOUNT
            RCLONE_CONFIG_B2_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing production backup prerequisite: $name" >&2
              exit 1
            fi
          done
          echo "PASS: required production backup configuration is present."

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Install backup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age rclone jq postgresql-client

      - name: Make backup script executable
        run: chmod +x ./scripts/backup-production.sh

      - name: Run encrypted dual-target production backup verification
        shell: bash
        run: |
          BACKUP_HEARTBEAT_URL="" ./scripts/backup-production.sh
