name: Production application release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Production release ellenőrzése vagy deploy"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - deploy
      commit_sha:
        description: "A release-re kijelölt main commit teljes SHA-ja"
        required: true
        type: string
      staging_deployment_sha:
        description: "A READY staging deployment Git SHA-ja (egyezzen a release SHA-val)"
        required: true
        type: string
      staging_uat_evidence:
        description: "A SHA-hoz kötött staging UAT jegyzőkönyv GitHub issue/PR URL-je"
        required: true
        type: string
      confirmation:
        description: "Deploy módnál írd be: DEPLOY-PRODUCTION"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: production-application-release
  cancel-in-progress: false

jobs:
  production-application-release:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'ugry65' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production – ahely-booking
    env:
      EXPECTED_VERCEL_PROJECT_ID: prj_ZW7nVAOcYPjttZtES2iHoeA8iOTo
      EXPECTED_SUPABASE_PROJECT_REF: yasrmxwjojepessivhmc
      EXPECTED_SITE_URL: https://foglalas.a-hely.com
      VERCEL_PROJECT_ID: ${{ secrets.PRODUCTION_VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}

    steps:
      - name: Check out requested release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Validate release request
        env:
          MODE: ${{ inputs.mode }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if ! [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full 40-character lowercase Git SHA." >&2
            exit 1
          fi

          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$REQUESTED_SHA" ]; then
            echo "Checked out SHA does not match requested release SHA." >&2
            exit 1
          fi

          if [ "$MODE" != "dry-run" ] && [ "$MODE" != "deploy" ]; then
            echo "Unknown release mode." >&2
            exit 1
          fi

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$REQUESTED_SHA" ]; then
            echo "Requested release SHA must be the current main HEAD; freeze main for UAT and release." >&2
            exit 1
          fi

          if [ "$MODE" = "deploy" ] && [ "$CONFIRMATION" != "DEPLOY-PRODUCTION" ]; then
            echo "Production deploy requires exact confirmation: DEPLOY-PRODUCTION" >&2
            exit 1
          fi

      - name: Validate production identity configuration
        run: |
          set -euo pipefail

          required=(VERCEL_PROJECT_ID VERCEL_ORG_ID VERCEL_TOKEN PRODUCTION_SUPABASE_PROJECT_REF PRODUCTION_SITE_URL)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing production release configuration: $name" >&2
              exit 1
            fi
          done

          [ "$VERCEL_PROJECT_ID" = "$EXPECTED_VERCEL_PROJECT_ID" ] || {
            echo "Refusing release: unexpected Vercel project ID." >&2
            exit 1
          }
          [ "$PRODUCTION_SUPABASE_PROJECT_REF" = "$EXPECTED_SUPABASE_PROJECT_REF" ] || {
            echo "Refusing release: unexpected Supabase production project ref." >&2
            exit 1
          }
          [ "$PRODUCTION_SITE_URL" = "$EXPECTED_SITE_URL" ] || {
            echo "Refusing release: unexpected production site URL." >&2
            exit 1
          }

      - name: Read and verify actual Vercel production configuration
        run: |
          set -euo pipefail
          npm install --global vercel@60.1.3 >/dev/null
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null
          node scripts/check-production-vercel-env.mjs

      - name: Validate staging UAT evidence and deployment identity
        env:
          STAGING_DEPLOYMENT_SHA: ${{ inputs.staging_deployment_sha }}
          STAGING_UAT_EVIDENCE: ${{ inputs.staging_uat_evidence }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [ "$STAGING_DEPLOYMENT_SHA" = "$REQUESTED_SHA" ] || {
            echo "Staging deployment SHA must equal the requested release SHA." >&2
            exit 1
          }
          [[ "$STAGING_UAT_EVIDENCE" =~ ^https://github\.com/ugry65/ahely-booking/(issues|pull)/[0-9]+(\#(issuecomment|discussion_r)[0-9]+)?$ ]] || {
            echo "Provide a GitHub issue or PR URL with recorded staging UAT evidence." >&2
            exit 1
          }

      - name: Verify actual staging Vercel deployment
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: node scripts/verify-staging-release-deployment.mjs

      - name: Dry-run summary
        if: ${{ inputs.mode == 'dry-run' }}
        run: |
          {
            echo "## Production application release dry-run"
            echo "- commit: \`${{ inputs.commit_sha }}\`"
            echo "- Vercel project identity: verified"
            echo "- Supabase project identity: verified"
            echo "- canonical site URL: verified"
            echo "- no deployment performed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preview dedicated production branch promotion
        if: ${{ inputs.mode == 'dry-run' }}
        run: |
          echo "Release candidate is eligible for later fast-forward promotion: ${{ inputs.commit_sha }}"
          echo "No production branch or Vercel setting is changed by this dry-run."

      - name: Stop before deploy until activation is explicitly completed
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          echo "Deploy mode is intentionally fail-closed while issue #241 activation prerequisites are incomplete." >&2
          echo "Required before enabling deployment: dedicated production branch protection, Vercel Production Branch Tracking main -> production, GitHub production reviewer verification, and controlled dry-run evidence." >&2
          exit 1
