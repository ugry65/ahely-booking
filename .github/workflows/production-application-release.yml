name: Production application release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Production release ellenőrzése vagy deploy"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - deploy
      commit_sha:
        description: "A release-re kijelölt main commit teljes SHA-ja"
        required: true
        type: string
      staging_deployment_sha:
        description: "A READY staging deployment Git SHA-ja (egyezzen a release SHA-val)"
        required: true
        type: string
      staging_uat_evidence:
        description: "A SHA-hoz kötött staging UAT jegyzőkönyv GitHub issue/PR URL-je"
        required: true
        type: string
      confirmation:
        description: "Deploy módnál írd be: DEPLOY-PRODUCTION"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: production-application-release
  cancel-in-progress: false

jobs:
  production-application-release:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'ugry65' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production – ahely-booking
    env:
      VERCEL_PROJECT_ID: prj_ZW7nVAOcYPjttZtES2iHoeA8iOTo
      VERCEL_ORG_ID: team_zUlC4KlLvkMuz1zRdq8ssAk2
      EXPECTED_SUPABASE_PROJECT_REF: yasrmxwjojepessivhmc
      EXPECTED_SITE_URL: https://foglalas.a-hely.com
      VERCEL_TOKEN: ${{ secrets.PRODUCTION_RELEASE_VERCEL_TOKEN }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}

    steps:
      - name: Check out requested release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Validate release request
        env:
          MODE: ${{ inputs.mode }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if ! [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full 40-character lowercase Git SHA." >&2
            exit 1
          fi

          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$REQUESTED_SHA" ]; then
            echo "Checked out SHA does not match requested release SHA." >&2
            exit 1
          fi

          if [ "$MODE" != "dry-run" ] && [ "$MODE" != "deploy" ]; then
            echo "Unknown release mode." >&2
            exit 1
          fi

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$REQUESTED_SHA" ]; then
            echo "Requested release SHA must be the current main HEAD; freeze main for UAT and release." >&2
            exit 1
          fi

          if [ "$MODE" = "deploy" ] && [ "$CONFIRMATION" != "DEPLOY-PRODUCTION" ]; then
            echo "Production deploy requires exact confirmation: DEPLOY-PRODUCTION" >&2
            exit 1
          fi

      - name: Use the production project's Node version
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate production identity configuration
        run: |
          set -euo pipefail

          required=(VERCEL_TOKEN PRODUCTION_SUPABASE_PROJECT_REF PRODUCTION_SITE_URL)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing production release configuration: $name" >&2
              exit 1
            fi
          done

          [ "$PRODUCTION_SUPABASE_PROJECT_REF" = "$EXPECTED_SUPABASE_PROJECT_REF" ] || {
            echo "Refusing release: unexpected Supabase production project ref." >&2
            exit 1
          }
          [ "$PRODUCTION_SITE_URL" = "$EXPECTED_SITE_URL" ] || {
            echo "Refusing release: unexpected production site URL." >&2
            exit 1
          }

      - name: Read and verify actual Vercel production configuration
        run: |
          set -euo pipefail
          npm install --global vercel@60.1.3 >/dev/null
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null
          node scripts/check-production-vercel-env.mjs

      - name: Refuse production credentials in Preview scopes
        run: |
          set -euo pipefail
          vercel pull --yes --environment=preview --git-branch=feat/production-release-gate-241 --token="$VERCEL_TOKEN" >/dev/null
          node scripts/check-production-preview-scope.mjs
          vercel pull --yes --environment=preview --git-branch=staging --token="$VERCEL_TOKEN" >/dev/null
          node scripts/check-production-preview-scope.mjs

      - name: Validate staging UAT evidence and deployment identity
        env:
          STAGING_DEPLOYMENT_SHA: ${{ inputs.staging_deployment_sha }}
          STAGING_UAT_EVIDENCE: ${{ inputs.staging_uat_evidence }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [ "$STAGING_DEPLOYMENT_SHA" = "$REQUESTED_SHA" ] || {
            echo "Staging deployment SHA must equal the requested release SHA." >&2
            exit 1
          }
          [[ "$STAGING_UAT_EVIDENCE" =~ ^https://github\.com/ugry65/ahely-booking/(issues|pull)/[0-9]+(\#(issuecomment|discussion_r)[0-9]+)?$ ]] || {
            echo "Provide a GitHub issue or PR URL with recorded staging UAT evidence." >&2
            exit 1
          }

      - name: Verify actual staging Vercel deployment
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: node scripts/verify-staging-release-deployment.mjs

      - name: Dry-run summary
        if: ${{ inputs.mode == 'dry-run' }}
        run: |
          {
            echo "## Production application release dry-run"
            echo "- commit: \`${{ inputs.commit_sha }}\`"
            echo "- Vercel project identity: verified"
            echo "- Supabase project identity: verified"
            echo "- canonical site URL: verified"
            echo "- no deployment performed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm dry-run performed no deployment
        if: ${{ inputs.mode == 'dry-run' }}
        run: |
          echo "Release candidate passed preflight for a later CLI deployment: ${{ inputs.commit_sha }}"
          echo "No production deployment or Vercel setting is changed by this dry-run."

      - name: Recheck main immediately before production build
        if: ${{ inputs.mode == 'deploy' }}
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"

      - name: Require production Git isolation before CLI deployment
        if: ${{ inputs.mode == 'deploy' }}
        run: node scripts/check-production-git-isolation.mjs

      - name: Build exact commit with production configuration
        if: ${{ inputs.mode == 'deploy' }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Recheck main immediately before production deploy
        if: ${{ inputs.mode == 'deploy' }}
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          node scripts/check-production-vercel-env.mjs

      - name: Deploy approved artifact to production
        if: ${{ inputs.mode == 'deploy' }}
        id: deployment
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --meta "releaseCommitSha=$REQUESTED_SHA" --meta "githubActionsRunId=$GITHUB_RUN_ID")"
          [[ "$url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]] || { echo "Unexpected deployment URL" >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify and record production deployment
        if: ${{ inputs.mode == 'deploy' }}
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          STAGING_UAT_EVIDENCE: ${{ inputs.staging_uat_evidence }}
        run: node scripts/verify-production-release-deployment.mjs

      - name: Check production health after deployment
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const response = await fetch('https://foglalas.a-hely.com/api/health', { cache: 'no-store' });
          const health = response.ok ? await response.json() : null;
          if (!response.ok || health?.ok !== true || health?.database !== 'ok') {
            throw new Error('Production health check failed; inspect and request rollback approval');
          }
          console.log('Production health and database check passed.');
          NODE
