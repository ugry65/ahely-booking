name: Verify Google Drive OAuth client

on:
  pull_request:
    branches:
      - feature/82-pricing-modes
    paths:
      - ".github/workflows/verify-gdrive-oauth-client.yml"

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event.pull_request.head.ref == 'infra/100-backup-monitoring' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLIENT_ID: ${{ secrets.BACKUP_GDRIVE_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.BACKUP_GDRIVE_CLIENT_SECRET }}
    steps:
      - name: Verify secrets are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLIENT_ID" || { echo "BACKUP_GDRIVE_CLIENT_ID is missing" >&2; exit 1; }
          test -n "$CLIENT_SECRET" || { echo "BACKUP_GDRIVE_CLIENT_SECRET is missing" >&2; exit 1; }

      - name: Verify OAuth client ID and secret pair with Google
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error \
            --request POST \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "code=ahely-intentional-invalid-verification-code" \
            --data-urlencode "grant_type=authorization_code" \
            --data-urlencode "redirect_uri=http://localhost" \
            https://oauth2.googleapis.com/token)"

          error="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("error", ""))')"
          if [ "$error" != "invalid_grant" ]; then
            echo "Google did not accept the configured OAuth client credential pair (expected invalid_grant for the deliberately invalid authorization code)." >&2
            exit 1
          fi
          echo "PASS: Google accepted the configured OAuth client ID/secret pair; the deliberate authorization code was rejected as expected."
