name: Application checks

on:
  pull_request:
    # Required on every release PR, including documentation-only releases.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-auth-restore-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: restore_compat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: bash ./scripts/test-isolated-auth-restore.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: restore_compat_test
          PGUSER: postgres
          PGPASSWORD: isolated-test-only

  application-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/test-production-release-pr.mjs
      - run: bash ./scripts/test-production-db-url-guard.sh
      - run: bash ./scripts/test-deploy-training-group-316.sh
      - run: bash ./scripts/test-production-backup-trigger.sh
      - run: bash ./scripts/test-production-backup-drill.sh
      - run: bash ./scripts/test-production-backup-schedule-trigger.sh
      - run: bash ./scripts/test-production-backup-heartbeat.sh
      - run: node ./scripts/test-production-backup-schedule.mjs
      - run: bash ./scripts/test-backup-production.sh
      - run: bash ./scripts/test-retention-production.sh
      - run: node ./scripts/test-production-retention-workflow.mjs
      - run: bash ./scripts/test-production-restore-trigger.sh
      - run: bash ./scripts/test-restore-data-compatibility.sh
      - run: node ./scripts/test-supabase-availability-healthcheck.mjs
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-server-only-placeholder
          SITE_URL: http://localhost:3000
