name: Application checks

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "next.config.ts"
      - "proxy.ts"
      - "docs/BACKUP_RESTORE_*.md"
      - "docs/STAGING_ADATBAZIS_DEPLOY.md"
      - "docs/PRODUCTION_ADATBAZIS_DEPLOY.md"
      - "docs/STAGING_WEB_ES_UAT_BOOTSTRAP.md"
      - "docs/IMPLEMENTATION_PLAN.md"
      - ".github/workflows/application-checks.yml"
      - ".github/workflows/staging-database-deploy.yml"
      - ".github/workflows/production-database-deploy.yml"
      - ".github/workflows/staging-uat-bootstrap.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-server-only-placeholder
          SITE_URL: http://localhost:3000
