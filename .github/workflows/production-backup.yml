name: Production database backup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Kézi production backuphoz írd be: BACKUP"
        required: true
        default: ""
        type: string
  schedule:
    - cron: "0 8 * * *"
      timezone: "Europe/Budapest"
    - cron: "0 12 * * *"
      timezone: "Europe/Budapest"
    - cron: "0 16 * * *"
      timezone: "Europe/Budapest"
    - cron: "0 20 * * *"
      timezone: "Europe/Budapest"

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  production-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      BACKUP_GDRIVE_REMOTE: ${{ vars.BACKUP_GDRIVE_REMOTE }}
      BACKUP_B2_REMOTE: ${{ vars.BACKUP_B2_REMOTE }}

      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.BACKUP_GDRIVE_CLIENT_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_GDRIVE_CLIENT_SECRET }}
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.BACKUP_GDRIVE_RCLONE_TOKEN }}

      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.BACKUP_B2_ACCOUNT_ID }}
      RCLONE_CONFIG_B2_KEY: ${{ secrets.BACKUP_B2_APPLICATION_KEY }}

      HEARTBEAT_08_URL: ${{ secrets.BACKUP_HEARTBEAT_08_URL }}
      HEARTBEAT_12_URL: ${{ secrets.BACKUP_HEARTBEAT_12_URL }}
      HEARTBEAT_16_URL: ${{ secrets.BACKUP_HEARTBEAT_16_URL }}
      HEARTBEAT_20_URL: ${{ secrets.BACKUP_HEARTBEAT_20_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require explicit confirmation for manual backup
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "BACKUP" ]; then
            echo "Manual production backup requires confirmation input: BACKUP" >&2
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Install backup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age rclone jq postgresql-client

      - name: Validate required production backup configuration
        run: |
          required=(
            PRODUCTION_DB_URL
            BACKUP_AGE_RECIPIENT
            BACKUP_GDRIVE_REMOTE
            BACKUP_B2_REMOTE
            RCLONE_CONFIG_GDRIVE_CLIENT_ID
            RCLONE_CONFIG_GDRIVE_CLIENT_SECRET
            RCLONE_CONFIG_GDRIVE_TOKEN
            RCLONE_CONFIG_B2_ACCOUNT
            RCLONE_CONFIG_B2_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing production backup configuration: $name" >&2
              exit 1
            fi
          done

      - name: Make backup script executable
        run: chmod +x ./scripts/backup-production.sh

      - name: Run encrypted dual-target production backup
        shell: bash
        run: |
          heartbeat_url=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 8 * * *") heartbeat_url="$HEARTBEAT_08_URL" ;;
              "0 12 * * *") heartbeat_url="$HEARTBEAT_12_URL" ;;
              "0 16 * * *") heartbeat_url="$HEARTBEAT_16_URL" ;;
              "0 20 * * *") heartbeat_url="$HEARTBEAT_20_URL" ;;
              *)
                echo "Unknown production backup schedule: ${{ github.event.schedule }}" >&2
                exit 1
                ;;
            esac
            if [ -z "$heartbeat_url" ]; then
              echo "Missing heartbeat URL for scheduled backup slot" >&2
              exit 1
            fi
          fi

          BACKUP_HEARTBEAT_URL="$heartbeat_url" ./scripts/backup-production.sh
